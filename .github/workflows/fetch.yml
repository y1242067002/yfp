name: Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */1 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

    # =======================
    # 1. 拉取代码
    # =======================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # =======================
    # 2. 环境配置
    # =======================
    - name: Set timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # =======================
    # 3. 执行脚本（防卡死）
    # =======================
    - name: Run fetch script
      run: |
        timeout 600 python ./fetch.py

    # =======================
    # 4. GitHub 提交
    # =======================
    - name: Commit changes (GitHub)
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        git add list* snippets/

        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') update nodes" || echo "no changes"

    - name: Push to GitHub
      run: |
        git push origin master --force

    # =======================
    # 5. CDN 缓存刷新（保留）
    # =======================
    - name: Calculate purge urls
      id: purge_urls
      run: |
        sleep 1
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""

        for f in $(find snippets -name "*.yml" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        for f in $(find . -maxdepth 1 -name "list*" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

    - name: Purge JsDelivr Cache
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
