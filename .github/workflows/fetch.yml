name: Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */1 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

    # =======================
    # 1. Checkout
    # =======================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # =======================
    # 2. 环境
    # =======================
    - name: Set timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # =======================
    # 3. 执行任务（防卡死）
    # =======================
    - name: Run fetch script
      run: |
        echo "🚀 start fetch.py"
        timeout 600 python ./fetch.py
        echo "✅ fetch.py done"

    # =======================
    # 4. GitHub 提交
    # =======================
    - name: Commit changes (GitHub)
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        git add list* snippets/

        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') v3.3.2 update" || echo "no changes"

    - name: Push to GitHub
      run: |
        echo "📤 push to GitHub"
        git push origin master --force
        echo "✅ GitHub push done"

    # =======================
    # 5. Gitee 同步（稳定诊断版）
    # =======================
    - name: Sync to Gitee (debug stable)
      run: |
        set -e

        echo "🔧 config git"
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        echo "🔗 remove old remote"
        git remote remove gitee 2>/dev/null || true

        echo "🔗 add gitee remote"
        git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/yfp.git

        echo "🚀 start push to gitee (NO QUIET + TIMEOUT)"

        # ⭐关键修复：不再 silent + 加 timeout
        timeout 120 git push gitee HEAD:master --force

        echo "✅ gitee push finished"

    # =======================
    # 6. CDN 清理（轻量）
    # =======================
    - name: Calculate purge urls
      id: purge_urls
      run: |
        sleep 1
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""

        for f in $(find snippets -name "*.yml" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        for f in $(find . -maxdepth 1 -name "list*" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

    - name: Purge JsDelivr Cache
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
