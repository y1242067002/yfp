name: Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */1 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

    # =======================
    # 1. Checkout
    # =======================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # =======================
    # 2. 环境
    # =======================
    - name: Set timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # =======================
    # 3. 执行脚本（防卡死）
    # =======================
    - name: Run fetch script
      run: |
        timeout 600 python ./fetch.py

    # =======================
    # 4. GitHub 提交
    # =======================
    - name: Commit changes (GitHub)
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        git pull origin master --rebase || true

        git add list* snippets/

        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') v3.1 update" || echo "no changes"

    - name: Push to GitHub
      run: |
        git push origin master --force

    # =======================
    # 5. Gitee 镜像同步（v3.1 修复核心）
    # =======================
    - name: Sync to Gitee (v3.1 stable mirror)
      run: |
        set -e

        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        # 清理旧 remote（避免重复）
        git remote remove gitee 2>/dev/null || true

        # 重新绑定 Gitee
        git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/yfp.git

        # ⭐ v3.1 核心修复：永远用 HEAD（避免 refspec 错误）
        git fetch origin master || true

        git push gitee HEAD:master --force --quiet

    # =======================
    # 6. CDN 刷新（优化版）
    # =======================
    - name: Calculate purge urls
      id: purge_urls
      run: |
        sleep 2
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""

        for f in $(find snippets -name "*.yml" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        for f in $(find . -maxdepth 1 -name "list*" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

    - name: Purge JsDelivr Cache
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
