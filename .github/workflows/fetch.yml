name: Fetch-v4

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */1 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1. Checkout
    # =========================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # =========================
    # 2. 环境
    # =========================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # =========================
    # 3. 执行抓取
    # =========================
    - name: Run fetch script
      run: |
        timeout 600 python ./fetch.py

    # =========================
    # 4. 🔥 核心：配置兼容修复
    # =========================
    - name: Fix compatibility (Clash/Meta/Verge)
      run: |
        echo "🧹 fixing deprecated fields..."

        # 1. fingerprint → client-fingerprint
        find snippets -type f -name "*.yml" -exec sed -i 's/fingerprint:/client-fingerprint:/g' {} \; || true

        # 2. global-client-fingerprint → client-fingerprint
        find snippets -type f -name "*.yml" -exec sed -i 's/global-client-fingerprint:/client-fingerprint:/g' {} \; || true

        # 3. 清理空 proxy 字段（防解析错误）
        find snippets -type f -name "*.yml" -exec sed -i '/fingerprint/d' {} \; || true

        echo "✅ compatibility fix done"

    # =========================
    # 5. GitHub 提交
    # =========================
    - name: Commit changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        git add list* snippets/

        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') v4 compatible update" || echo "no changes"

    - name: Push to GitHub
      run: |
        git push origin master --force

    # =========================
    # 6. CDN 刷新
    # =========================
    - name: Calculate purge urls
      id: purge_urls
      run: |
        sleep 1
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""

        for f in $(find snippets -name "*.yml" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        for f in $(find . -maxdepth 1 -name "list*" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

    - name: Purge JsDelivr Cache
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
