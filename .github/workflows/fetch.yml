name: Fetch-v4.2

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */1 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1. 拉取代码
    # =========================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # =========================
    # 2. Python 环境
    # =========================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install pyyaml

    # =========================
    # 3. 执行抓取
    # =========================
    - name: Run fetch script
      run: |
        timeout 600 python ./fetch.py

    # =========================
    # 4. 🔥 v4.2 核心修复（结构级）
    # =========================
    - name: Deep YAML compatibility fix
      run: |
        python - << 'EOF'
        import os
        import yaml

        ROOTS = ["snippets", "."]

        def fix_proxy(obj):
            if isinstance(obj, dict):
                # 删除旧字段
                obj.pop("fingerprint", None)
                obj.pop("global-client-fingerprint", None)

                # 替换为新字段
                if "client-fingerprint" not in obj and "fingerprint" in obj:
                    obj["client-fingerprint"] = obj.pop("fingerprint")

                for k in obj:
                    obj[k] = fix_proxy(obj[k])

            elif isinstance(obj, list):
                return [fix_proxy(i) for i in obj]

            return obj

        def process_file(path):
            try:
                with open(path, "r", encoding="utf-8") as f:
                    data = yaml.safe_load(f)

                if data is None:
                    return

                data = fix_proxy(data)

                with open(path, "w", encoding="utf-8") as f:
                    yaml.safe_dump(data, f, allow_unicode=True)

                print("fixed:", path)

            except Exception as e:
                print("skip:", path, e)

        for root in ROOTS:
            for dirpath, _, files in os.walk(root):
                for file in files:
                    if file.endswith(".yml") or file.endswith(".yaml"):
                        process_file(os.path.join(dirpath, file))
        EOF

    # =========================
    # 5. GitHub 提交
    # =========================
    - name: Commit changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        git add list* snippets/

        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') v4.2 auto-fix" || echo "no changes"

    - name: Push to GitHub
      run: |
        git push origin master --force

    # =========================
    # 6. CDN 刷新
    # =========================
    - name: Calculate purge urls
      id: purge_urls
      run: |
        sleep 1
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""

        for f in $(find snippets -name "*.yml" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        for f in $(find . -maxdepth 1 -name "list*" -type f 2>/dev/null); do
          urls+="${baseUrl}/${f},"
        done

        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

    - name: Purge JsDelivr Cache
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
