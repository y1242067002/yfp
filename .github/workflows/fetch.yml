name: Fetch

on:
  workflow_dispatch:
  schedule:
    # 每小时 30 分钟执行一次
    - cron: '30 */1 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run fetch script
      run: python ./fetch.py

    # =======================
    # 提交到 GitHub
    # =======================
    - name: Commit changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        git pull origin master || true
        git add list* snippets/

        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') 抓取节点" || echo "no changes"

    - name: Push to GitHub
      uses: ad-m/github-push-action@master
      with:
        branch: master

    # =======================
    # 同步到 Gitee（只同步 list.yml）
    # =======================
    - name: Sync to Gitee (only list.yml)
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git remote remove gitee || true
        git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/yfp.git

        git add list.yml

        git commit -m "sync list.yml $(date '+%Y-%m-%d %H:%M:%S')" || echo "no changes"

        git push gitee master --force

    # =======================
    # CDN 缓存清理
    # =======================
    - name: Calculate purge urls
      id: purge_urls
      run: |
        sleep 5
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""

        for f in $(find snippets -name "*.yml" -type f); do
          urls+="${baseUrl}/${f},"
        done

        for f in $(find . -maxdepth 1 -name "list*" -type f); do
          urls+="${baseUrl}/${f},"
        done

        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

    - name: Purge JsDelivr Cache
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
